<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunch Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--ink:#17212b;--muted:#71808d;--card:#fff;--green:#167c58;--greenbg:#e8f5ee;--line:#e8edf1;--orange:#f4a261;--shadow:0 8px 24px rgba(26,39,51,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink)}header{background:#142d28;color:white;padding:30px 22px 26px}.wrap{max-width:1120px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-family:Manrope,sans-serif;font-size:28px;letter-spacing:-1px}.brand span{color:#84d4ae}.sub{color:#c2d4cd;margin-top:6px;font-size:14px}.datebox{text-align:right;color:#d6e5df;font-size:13px}.datebox strong{display:block;color:white;font-size:17px;margin-bottom:4px}.main{max-width:1120px;margin:28px auto;padding:0 20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.toolbar h2{font-size:20px;margin:0}.sort{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 12px;font:inherit;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.restaurant{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.rhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.rname{font-family:Manrope,sans-serif;font-size:19px;font-weight:800}.tag{background:var(--greenbg);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.4px;padding:6px 9px;border-radius:20px;white-space:nowrap}.tag.warn{background:#fff3e5;color:#a75a15}.content{padding:16px 20px}.section{margin-bottom:15px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}.item{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #edf0f2;font-size:14px;line-height:1.45}.item:last-child{border:0}.price{font-weight:700;white-space:nowrap;color:var(--green)}.empty{color:var(--muted);font-size:14px}.foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.foot a{color:var(--green);font-weight:700;text-decoration:none}.notice{background:#fff8e9;border:1px solid #f2dfb5;color:#80602b;border-radius:12px;padding:12px 14px;margin:0 0 18px;font-size:13px}.bottom{text-align:center;color:var(--muted);font-size:12px;padding:26px}.bottom strong{color:var(--ink)}@media(max-width:750px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.datebox{text-align:left}.toolbar{align-items:flex-start;flex-direction:column}.main{padding:0 14px}header{padding:24px 16px}.item{font-size:13px}}
</style>
</head>
<body>
<header><div class="wrap head"><div><div class="brand">🍽️ Lunch <span>Hub</span></div><div class="sub">Polední menu na jednom místě</div></div><div class="datebox"><strong id="today">Čtvrtek 26. listopadu 2026</strong>Automatická aktualizace každý pracovní den v 10:00</div></div></header>
<main class="main"><div class="notice" id="notice">Načítám aktuální menu…</div>
<div class="toolbar"><h2>Restaurace v přehledu <span id="count"></span></h2><select class="sort" id="sort"><option value="default">Původní pořadí</option><option value="price">Seřadit podle nejnižší ceny</option><option value="name">Seřadit podle názvu</option></select></div><div class="grid" id="restaurants"></div></main>
<div class="bottom">Lunch Hub · <strong>Dobré jídlo, bez hledání.</strong></div>
<script>
let data=[];
function minPrice(r){let vals=(r.sections||[]).flatMap(s=>s.items||[]).map(i=>parseFloat((i.price||'').replace(/[^0-9]/g,''))).filter(n=>n>0);return vals.length?Math.min(...vals):99999}
function render(){let arr=[...data];const sort=document.getElementById('sort').value;if(sort==='price')arr.sort((a,b)=>minPrice(a)-minPrice(b));if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'cs'));document.getElementById('count').textContent='('+arr.length+')';document.getElementById('restaurants').innerHTML=arr.map(r=>`<article class="restaurant"><div class="rhead"><div class="rname">${r.name}</div><div class="tag ${r.ok?'':'warn'}">${r.status|| (r.ok?'Menu načteno':'Menu nedostupné')}</div></div><div class="content">${(r.sections||[]).length?(r.sections||[]).map(s=>`<div class="section"><div class="label">${s.title}</div>${(s.items||[]).map(i=>`<div class="item"><span>${i.name}</span><span class="price">${i.price||''}</span></div>`).join('')}</div>`).join(''):`<div class="empty">Menu se nepodařilo načíst. Otevřete web restaurace pro aktuální nabídku.</div>`}${r.error?`<div class="empty">${r.error}</div>`:''}</div><div class="foot"><span>${r.ok?'Menu načteno':'Menu nebylo načteno'}</span><a href="${r.url}" target="_blank" rel="noopener">Otevřít web ↗</a></div></article>`).join('')||'<div class="empty">Zatím žádná data. Automatické načítání se spustí po nasazení.</div>'}
async function load(){try{const res=await fetch('./data/menu.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('Soubor s menu není dostupný');const payload=await res.json();data=payload.restaurants||[];document.getElementById('today').textContent=payload.date||'Aktuální menu';document.getElementById('notice').textContent='Poslední aktualizace: '+(payload.updated_label||'zatím neznámá')+' · automatická aktualizace v pracovní dny v 10:00';render()}catch(e){document.getElementById('notice').textContent='Aktuální data se nepodařilo načíst. Zkuste stránku obnovit nebo otevřete web restaurace.';document.getElementById('restaurants').innerHTML='<div class="empty">Menu zatím není k dispozici.</div>'}}
document.getElementById('sort').addEventListener('change',render);load();
</script></body></html>
