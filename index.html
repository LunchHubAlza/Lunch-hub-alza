<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunch Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--ink:#17212b;--muted:#71808d;--card:#fff;--green:#167c58;--greenbg:#e8f5ee;--line:#e8edf1;--orange:#f4a261;--shadow:0 8px 24px rgba(26,39,51,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink)}header{background:#142d28;color:white;padding:30px 22px 26px}.wrap{max-width:1120px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-family:Manrope,sans-serif;font-size:28px;letter-spacing:-1px}.brand span{color:#84d4ae}.sub{color:#c2d4cd;margin-top:6px;font-size:14px}.datebox{text-align:right;color:#d6e5df;font-size:13px}.datebox strong{display:block;color:white;font-size:17px;margin-bottom:4px}.main{max-width:1120px;margin:28px auto;padding:0 20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.toolbar h2{font-size:20px;margin:0}.sort{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 12px;font:inherit;color:var(--ink)}.filterbar{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin:0 0 18px;box-shadow:var(--shadow)}.filterhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.filtertitle{font-size:13px;font-weight:700}.filteractions{display:flex;gap:7px}.filteractions button{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:6px 9px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}.checks{display:flex;flex-wrap:wrap;gap:9px 16px}.checks label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer}.checks input{accent-color:var(--green);width:15px;height:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.restaurant{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.rhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.rname{font-family:Manrope,sans-serif;font-size:19px;font-weight:800}.tag{background:var(--greenbg);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.4px;padding:6px 9px;border-radius:20px;white-space:nowrap}.tag.warn{background:#fff3e5;color:#a75a15}.content{padding:16px 20px}.section{margin-bottom:15px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}.item{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #edf0f2;font-size:14px;line-height:1.45}.item:last-child{border:0}.price{font-weight:700;white-space:nowrap;color:var(--green)}.empty{color:var(--muted);font-size:14px}.foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.foot a{color:var(--green);font-weight:700;text-decoration:none}.notice{background:#fff8e9;border:1px solid #f2dfb5;color:#80602b;border-radius:12px;padding:12px 14px;margin:0 0 18px;font-size:13px}.bottom{text-align:center;color:var(--muted);font-size:12px;padding:26px}.bottom strong{color:var(--ink)}@media(max-width:750px){.filterhead{align-items:flex-start;flex-direction:column}.checks{gap:10px 13px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.datebox{text-align:left}.toolbar{align-items:flex-start;flex-direction:column}.main{padding:0 14px}header{padding:24px 16px}.item{font-size:13px}}
</style>
</head>
<body>
<header><div class="wrap head"><div><div class="brand">🍽️ Lunch <span>Hub</span></div><div class="sub">Polední menu na jednom místě</div></div><div class="datebox"><strong id="today">Čtvrtek 26. listopadu 2026</strong>Automatická aktualizace každý pracovní den v 10:00</div></div></header>
<main class="main"><div class="notice" id="notice">Načítám aktuální menu…</div>
<section class="filterbar" aria-label="Filtr restaurací"><div class="filterhead"><div class="filtertitle">Zobrazit restaurace</div><div class="filteractions"><button type="button" id="select-all">Všechny</button><button type="button" id="select-none">Žádná</button></div></div><div class="checks" id="restaurant-filters"></div></section>
<div class="toolbar"><h2>Restaurace v přehledu <span id="count"></span></h2><select class="sort" id="sort"><option value="default">Původní pořadí</option><option value="price">Seřadit podle nejnižší ceny</option><option value="name">Seřadit podle názvu</option></select></div><div class="grid" id="restaurants"></div></main>
<div class="bottom">Lunch Hub · <strong>Hladový alzák je zlý alzák.</strong></div>
<script>
let data=[];
const HIDDEN_KEY='lunchhub_hidden_restaurants_v1';
let hiddenRestaurants=new Set();
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function safeUrl(value){const url=String(value||'');return /^https?:\/\//i.test(url)?url:'#';}
function minPrice(r){const vals=(r.sections||[]).flatMap(s=>s.items||[]).map(i=>{const m=String(i.price||'').match(/\d+/);return m?Number(m[0]):NaN}).filter(n=>Number.isFinite(n)&&n>0);return vals.length?Math.min(...vals):99999}
function saveHidden(){try{localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenRestaurants]));}catch(e){}}
function loadHidden(){try{const parsed=JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]');hiddenRestaurants=new Set(Array.isArray(parsed)?parsed:[]);}catch(e){hiddenRestaurants=new Set();}}
function buildFilters(){
 const names=[...new Set(data.map(r=>r.name).filter(Boolean))];
 const root=document.getElementById('restaurant-filters');
 root.innerHTML=names.map((name,index)=>`<label><input type="checkbox" data-restaurant="${escapeHtml(name)}" ${hiddenRestaurants.has(name)?'':'checked'}><span>${escapeHtml(name)}</span></label>`).join('');
 root.querySelectorAll('input[type="checkbox"]').forEach(box=>box.addEventListener('change',()=>{
   const name=box.dataset.restaurant;
   if(box.checked)hiddenRestaurants.delete(name);else hiddenRestaurants.add(name);
   saveHidden();render();
 }));
}
function render(){
 let arr=data.filter(r=>!hiddenRestaurants.has(r.name));
 const sort=document.getElementById('sort').value;
 if(sort==='price')arr.sort((a,b)=>minPrice(a)-minPrice(b));
 if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'cs'));
 document.getElementById('count').textContent=`(${arr.length}/${data.length})`;
 document.getElementById('restaurants').innerHTML=arr.map(r=>{
   const sections=(r.sections||[]).filter(s=>(s.items||[]).length);
   const content=sections.length?sections.map(s=>`<div class="section"><div class="label">${escapeHtml(s.title)}</div>${(s.items||[]).map(i=>`<div class="item"><span>${escapeHtml(i.name)}</span><span class="price">${escapeHtml(i.price||'')}</span></div>`).join('')}</div>`).join(''):`<div class="empty">Menu se nepodařilo načíst. Otevřete web restaurace pro aktuální nabídku.</div>`;
   return `<article class="restaurant"><div class="rhead"><div class="rname">${escapeHtml(r.name)}</div><div class="tag ${r.ok?'':'warn'}">${escapeHtml(r.status||(r.ok?'Menu načteno':'Menu nedostupné'))}</div></div><div class="content">${content}${r.error?`<div class="empty">${escapeHtml(r.error)}</div>`:''}</div><div class="foot"><span>${r.ok?'Menu načteno':'Menu nebylo načteno'}</span><a href="${escapeHtml(safeUrl(r.url))}" target="_blank" rel="noopener">Otevřít web ↗</a></div></article>`;
 }).join('')||(arr.length===0?'<div class="empty">Není vybraná žádná restaurace. Zaškrtněte alespoň jednu výše.</div>':'<div class="empty">Zatím žádná data. Automatické načítání se spustí po nasazení.</div>');
}
async function load(){
 try{
   const res=await fetch('./data/menu.json?ts='+Date.now(),{cache:'no-store'});
   if(!res.ok)throw new Error('Soubor s menu není dostupný');
   const payload=await res.json();data=payload.restaurants||[];loadHidden();buildFilters();
   document.getElementById('today').textContent=payload.date||'Aktuální menu';
   document.getElementById('notice').textContent='Poslední aktualizace: '+(payload.updated_label||'zatím neznámá')+' · automatická aktualizace v pracovní dny v 10:00';
   render();
 }catch(e){
   document.getElementById('notice').textContent='Aktuální data se nepodařilo načíst. Zkuste stránku obnovit nebo otevřete web restaurace.';
   document.getElementById('restaurants').innerHTML='<div class="empty">Menu zatím není k dispozici.</div>';
 }
}
document.getElementById('sort').addEventListener('change',render);
document.getElementById('select-all').addEventListener('click',()=>{hiddenRestaurants.clear();saveHidden();buildFilters();render();});
document.getElementById('select-none').addEventListener('click',()=>{hiddenRestaurants=new Set(data.map(r=>r.name));saveHidden();buildFilters();render();});
load();
</script></body></html>
